<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cevapla · Telefon · Lokale Sor</title>
<link rel="stylesheet" href="../design/fonts.css">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#D8344B}
button,textarea,input{font-family:inherit}
html{background:#E4E5E1}body{margin:0;padding:32px 16px;display:flex;justify-content:center}body>div:first-child{box-shadow:0 0 0 1px #C9CCC5}
</style>
</head>
<body>
<div style="width: 390px; height: 1300px; box-sizing: border-box; background: #FFFFFF; font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: #15171C; display: flex; flex-direction: column">

  <header style="padding: 10px 16px; border-bottom: 1px solid #DDDFDA; display: flex; align-items: center; gap: 6px">
    <a href="5-gelen-telefon.html" aria-label="Geri" style="width: 44px; height: 44px; margin-left: -10px; color: #15171C; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M15 5 8 12l7 7"></path></svg></a>
    <span style="flex: 1; font-size: 18px; font-weight: 700">Cevapla</span>
    <span style="display: inline-flex; align-items: baseline; gap: 5px"><span style="width: 7px; height: 7px; border-radius: 999px; background: #D8344B; align-self: center"></span><span style="font-size: 22px; font-weight: 700; color: #D8344B; font-variant-numeric: tabular-nums">0:48</span><span style="font-size: 12px; color: #5F636B">kaldı</span></span>
  </header>

  <form style="flex: 1; padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 22px">

    <section style="background: #F0F1EE; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5F636B"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; background: #7B4CE0; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">E</span><span style="color: #15171C; font-weight: 600">Elif</span><span>soruyor</span></div>
      <p style="margin: 0; font-size: 18px; line-height: 25px; font-weight: 600">Kadıköy'de öğrenci bütçesine uygun, turistik olmayan bir akşam yemeği yeri?</p>
      <div style="display: flex; flex-wrap: wrap; gap: 4px"><span style="padding: 3px 8px; border-radius: 6px; background: #FFFFFF; font-size: 12px; font-weight: 500">Yerel yemek</span><span style="padding: 3px 8px; border-radius: 6px; background: #FFFFFF; font-size: 12px; font-weight: 500">Uygun fiyat</span><span style="padding: 3px 8px; border-radius: 6px; background: #FFFFFF; font-size: 12px; font-weight: 500">₺</span><span style="padding: 3px 8px; border-radius: 6px; background: #FFFFFF; font-size: 12px; font-weight: 500">Kadıköy</span></div>
    </section>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column">
      <legend style="padding: 0 0 4px; font-size: 15px; font-weight: 700">Hazır şablonlar</legend>
      <span style="font-size: 13px; color: #5F636B; padding-bottom: 10px">Dokun, metin alanına eklensin. Boşlukları doldur.</span>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <button type="button" style="min-height: 44px; padding: 10px 12px; border: 1px solid #C9CCC5; border-radius: 8px; background: #FFFFFF; color: #15171C; font-size: 14px; text-align: left">Bu saatte açık, şuraya git: …</button>
        <button type="button" aria-pressed="true" style="min-height: 44px; padding: 10px 12px; border: 1px solid #15171C; border-radius: 8px; background: #15171C; color: #FFFFFF; font-size: 14px; font-weight: 600; text-align: left">Şu semte bak: … (neden: …)</button>
        <button type="button" style="min-height: 44px; padding: 10px 12px; border: 1px solid #C9CCC5; border-radius: 8px; background: #FFFFFF; color: #15171C; font-size: 14px; text-align: left">Turistik ama değer: … / Turistik, gitme: …</button>
        <button type="button" style="min-height: 44px; padding: 10px 12px; border: 1px solid #C9CCC5; border-radius: 8px; background: #FFFFFF; color: #15171C; font-size: 14px; text-align: left">Bütçe dostu alternatif: …</button>
        <button type="button" style="min-height: 44px; padding: 10px 12px; border: 1px solid #C9CCC5; border-radius: 8px; background: #FFFFFF; color: #15171C; font-size: 14px; text-align: left">Tam emin değilim, ama şuna bak: …</button>
        <button type="button" style="min-height: 44px; padding: 10px 12px; border: 1px solid #C9CCC5; border-radius: 8px; background: #FFFFFF; color: #15171C; font-size: 14px; text-align: left">Bu soruyu daha önce cevaplamıştım</button>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="cevap" style="font-size: 15px; font-weight: 700">Cevabın</label>
      <textarea id="cevap" rows="4" style="box-sizing: border-box; padding: 12px 14px; border: 1.5px solid #15171C; border-radius: 8px; color: #15171C; font-size: 16px; line-height: 23px; resize: none">Şu semte bak: Kadıköy Çarşı'nın arka sokakları (neden: esnaf lokantaları ucuz, akşamları turist az). Moda'ya inme, orası pahalı.</textarea>
    </div>

    <label style="min-height: 44px; display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #15171C">Arşive eklensin <span style="font-size: 13px; color: #5F636B">· başkaları da görsün</span></label>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <button type="button" style="height: 52px; border: 0; border-radius: 8px; background: #15171C; color: #FFFFFF; font-size: 16px; font-weight: 700">Gönder</button>
      <button type="button" style="height: 44px; border: 0; background: transparent; color: #5F636B; font-size: 14px; font-weight: 600">Bilmiyorum, sıradakine geçsin</button>
    </div>
  </form>
</div>
</body>
</html>
