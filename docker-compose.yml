# Yerel geliştirme: sadece Postgres + Redis (ADR-022). Servisler `pnpm dev` ile yerelde çalışır.
# Portlar makinende doluysa: POSTGRES_PORT=55432 REDIS_PORT=56379 docker compose up -d
# (o zaman .env'deki DATABASE_URL / REDIS_URL portlarını da değiştir)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lokale
      POSTGRES_PASSWORD: lokale
      POSTGRES_DB: lokale
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lokale -d lokale"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
