<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gelen kutusu · Boş · Lokale Sor</title>
<link rel="stylesheet" href="../design/fonts.css">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#D8344B}
button{font-family:inherit}
html{background:#E4E5E1}body{margin:0;padding:32px 16px;display:flex;justify-content:center}body>div:first-child{box-shadow:0 0 0 1px #C9CCC5}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: #15171C; display: flex; flex-direction: column">

  <header style="padding: 10px 16px 12px; border-bottom: 1px solid #DDDFDA; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="display: inline-flex; align-items: baseline; gap: 2px; font-size: 22px; font-weight: 800; letter-spacing: -0.03em">Lokale Sor<span style="width: 7px; height: 7px; border-radius: 999px; background: #D8344B"></span></span>
      <div style="display: flex; align-items: center; gap: 4px">
        <button type="button" aria-label="Bildirimler" style="width: 44px; height: 44px; border: 0; background: transparent; color: #15171C; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9Z"></path><path d="M10 20.5h4"></path></svg></button>
        <button type="button" aria-label="Profil: Zeynep" style="width: 40px; height: 40px; border: 0; padding: 0; border-radius: 999px; background: #E9A21B; color: #15171C; font-size: 15px; font-weight: 700">Z</button>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <button type="button" style="height: 40px; padding: 0 10px; border: 1px solid #C9CCC5; border-radius: 8px; background: #FFFFFF; color: #15171C; font-size: 14px; display: inline-flex; align-items: center; gap: 6px"><span style="color: #5F636B">Şu an:</span><span style="font-weight: 700">İstanbul</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
      <div role="group" aria-label="Rol" style="display: inline-flex; padding: 3px; border-radius: 10px; background: #F0F1EE">
        <button type="button" aria-pressed="false" style="height: 34px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: #5F636B; font-size: 14px; font-weight: 600">Turist</button>
        <button type="button" aria-pressed="true" style="height: 34px; padding: 0 14px; border: 0; border-radius: 7px; background: #FFFFFF; color: #15171C; font-size: 14px; font-weight: 700; box-shadow: 0 0 0 1px #C9CCC5; display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #E9A21B"></span>Lokal</button>
      </div>
    </div>
  </header>

  <main style="flex: 1; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 10px; background: #F0F1EE">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">Bugün 0/2 soru</span>
        <span style="display: inline-flex; gap: 3px" aria-hidden="true"><span style="width: 40px; height: 5px; border-radius: 3px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #C9CCC5"></span><span style="width: 40px; height: 5px; border-radius: 3px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #C9CCC5"></span></span>
      </div>
      <a href="#" style="font-size: 14px; font-weight: 700; min-height: 44px; display: inline-flex; align-items: center">Ayarlar</a>
    </div>

    <h1 style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 800; letter-spacing: -0.03em">Gelen kutusu</h1>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 12px; padding-bottom: 60px">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#C9CCC5" stroke-width="1.2" stroke-linecap="square" aria-hidden="true"><path d="M4 5h16v14H4Z"></path><path d="M4 13h5l1 2h4l1-2h5"></path></svg>
      <p style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.02em">Şu an sana atanmış soru yok.</p>
      <p style="margin: 0; font-size: 16px; line-height: 23px; color: #3D4047">Bugün 2 soru daha alabilirsin. Yeni bir soru gelince sana hemen haber vereceğiz.</p>
      <a href="#" style="margin-top: 6px; font-size: 15px; font-weight: 700; min-height: 44px; display: inline-flex; align-items: center">Bildirim ayarlarını kontrol et</a>
    </div>
  </main>

  <nav aria-label="Ana menü" style="border-top: 1px solid #DDDFDA; padding: 0 6px 20px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="#" style="text-decoration: none; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5F636B; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M4 10 12 4l8 6v10H4Z"></path></svg>Ana sayfa</a>
    <a href="#" style="text-decoration: none; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5F636B; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Soru sor</a>
    <a href="#" style="text-decoration: none; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5F636B; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"></path></svg>Sorularım</a>
    <a href="#" aria-current="page" style="text-decoration: none; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #15171C; font-size: 11px; font-weight: 700; box-shadow: inset 0 3px 0 #E9A21B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M4 5h16v14H4Z"></path><path d="M4 13h5l1 2h4l1-2h5"></path></svg>Gelen kutusu</a>
    <a href="#" style="text-decoration: none; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5F636B; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"></path></svg>Profil</a>
  </nav>
</div>
</body>
</html>
