<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ara durum · Aranıyor · Lokale Sor</title>
<link rel="stylesheet" href="../design/fonts.css">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#D8344B}
button{font-family:inherit}
html{background:#E4E5E1}body{margin:0;padding:32px 16px;display:flex;justify-content:center}body>div:first-child{box-shadow:0 0 0 1px #C9CCC5}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: #15171C; padding: 20px 16px 32px; display: flex; flex-direction: column">

  <span style="display: inline-flex; align-items: baseline; gap: 2px; font-size: 22px; font-weight: 800; letter-spacing: -0.03em">Lokale Sor<span style="width: 7px; height: 7px; border-radius: 999px; background: #D8344B"></span></span>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 36px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #5F636B"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="1.5" width="11" height="11" fill="none" stroke="#5F636B" stroke-width="1.5"></rect><rect x="5" y="5" width="4" height="4" fill="#5F636B"></rect></svg>Otomatik mesaj</span>
      <h1 style="margin: 0; font-size: 32px; line-height: 36px; font-weight: 800; letter-spacing: -0.03em">Senin için uygun lokali arıyoruz…</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #3D4047">Kadıköy'de yaşayan, yemek sorularını cevaplayan ve şu an müsait biri.</p>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid #DDDFDA">
      <li style="padding: 14px 0; border-bottom: 1px solid #DDDFDA; display: flex; align-items: center; gap: 12px">
        <span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: #2C5BF0; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 5px #2C5BF0">M</span>
        <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">Mert</span><span style="font-size: 13px; color: #5F636B">Kadıköy · ~20 dk</span></div>
        <span style="font-size: 13px; font-weight: 600">Kontrol ediliyor</span>
      </li>
      <li style="padding: 14px 0; border-bottom: 1px solid #DDDFDA; display: flex; align-items: center; gap: 12px; opacity: .55">
        <span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: #E9A21B; color: #15171C; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Z</span>
        <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">Zeynep</span><span style="font-size: 13px; color: #3D4047">Moda · ~25 dk</span></div>
        <span style="font-size: 13px; color: #3D4047">Sırada</span>
      </li>
    </ul>

    <div style="display: flex; gap: 6px" aria-hidden="true">
      <span style="flex: 1; height: 3px; border-radius: 2px; background: #15171C"></span>
      <span style="flex: 1; height: 3px; border-radius: 2px; background: #15171C"></span>
      <span style="flex: 1; height: 3px; border-radius: 2px; background: #DDDFDA"></span>
    </div>
  </div>

  <button type="button" style="height: 48px; border: 0; background: transparent; color: #15171C; font-size: 15px; font-weight: 700; text-decoration: underline; text-underline-offset: 4px">Vazgeç</button>
</div>
</body>
</html>
